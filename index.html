<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tela de Cadastro</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: #f5f6fb;
        color: #1f1f1f;
      }

      body {
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 24px;
      }

      .card {
        width: min(560px, 100%);
        background: #ffffff;
        border-radius: 16px;
        padding: 32px;
        box-shadow: 0 16px 40px rgba(15, 23, 42, 0.12);
        text-align: center;
      }

      .company-name {
        font-weight: 700;
        letter-spacing: 0.12em;
        color: #4f46e5;
        font-size: 14px;
        text-transform: uppercase;
        margin-bottom: 12px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 26px;
      }

      p {
        margin: 0 0 24px;
        color: #525252;
      }

      form {
        display: grid;
        gap: 16px;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        justify-items: center;
      }

      label {
        font-weight: 600;
        margin-bottom: 6px;
        display: inline-block;
        text-align: center;
      }

      input {
        width: 100%;
        padding: 8px 10px;
        border-radius: 10px;
        border: 1px solid #d1d5db;
        font-size: 13px;
        transition: border 0.2s ease, box-shadow 0.2s ease;
      }

      input:focus {
        outline: none;
        border-color: #6366f1;
        box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
      }

      .row {
        display: contents;
      }

      .field {
        width: 100%;
        max-width: 210px;
      }

      .full-width {
        grid-column: 1 / -1;
        width: 100%;
      }

      button {
        margin-top: 4px;
        padding: 10px 16px;
        border: none;
        border-radius: 10px;
        background: #4f46e5;
        color: #ffffff;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      button:hover {
        transform: translateY(-1px);
        box-shadow: 0 8px 16px rgba(79, 70, 229, 0.25);
      }

      .hint {
        font-size: 12px;
        color: #6b7280;
        margin-top: 4px;
      }

      .divider {
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 4px 0;
        color: #6b7280;
        font-size: 12px;
      }

      .divider::before,
      .divider::after {
        content: "";
        flex: 1;
        height: 1px;
        background: #e5e7eb;
      }

      .social-buttons {
        display: grid;
        gap: 10px;
        justify-items: center;
      }

      .social-button {
        width: 100%;
        max-width: 280px;
        padding: 8px 12px;
        border-radius: 10px;
        border: 1px solid #d1d5db;
        background: #ffffff;
        color: #111827;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }

      .social-button:hover {
        border-color: #c7c9d1;
        box-shadow: 0 6px 12px rgba(15, 23, 42, 0.08);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="company-name">EMPREGATUR</div>
      <h1>Cadastro</h1>
      <p>Preencha seus dados para concluir o cadastro.</p>
      <form>
        <div class="row">
          <div class="field">
            <label for="nome">Nome</label>
            <input id="nome" name="nome" type="text" placeholder="Ex: Ana" required />
          </div>
          <div class="field">
            <label for="sobrenome">Sobrenome</label>
            <input id="sobrenome" name="sobrenome" type="text" placeholder="Ex: Silva" required />
          </div>
        </div>
        <div class="row">
          <div class="field">
            <label for="cpf">CPF</label>
            <input
              id="cpf"
              name="cpf"
              type="text"
              inputmode="numeric"
              placeholder="000.000.000-00"
              maxlength="14"
              pattern="\d{3}\.\d{3}\.\d{3}-\d{2}"
              required
            />
            <div class="hint">Formato: 000.000.000-00</div>
          </div>
          <div class="field">
            <label for="data-nascimento">Data de nascimento</label>
            <input id="data-nascimento" name="data-nascimento" type="date" required />
          </div>
        </div>
        <div class="row">
          <div class="field">
            <label for="contato">Contato</label>
            <input
              id="contato"
              name="contato"
              type="tel"
              placeholder="(00) 00000-0000"
              inputmode="tel"
              required
            />
          </div>
          <div class="field">
            <label for="email">E-mail</label>
            <input id="email" name="email" type="email" placeholder="voce@email.com" required />
          </div>
        </div>
        <button class="full-width" type="submit">Cadastrar</button>
        <div class="divider full-width">ou</div>
        <div class="social-buttons full-width">
          <button class="social-button" type="button">Cadastrar com Google</button>
          <button class="social-button" type="button">Cadastrar com Facebook</button>
        </div>
      </form>
    </main>
    <script>
      const cpfInput = document.querySelector("#cpf");

      const formatCpf = (value) => {
        const digits = value.replace(/\D/g, "").slice(0, 11);
        const parts = [];

        if (digits.length > 0) {
          parts.push(digits.slice(0, 3));
        }
        if (digits.length > 3) {
          parts.push(digits.slice(3, 6));
        }
        if (digits.length > 6) {
          parts.push(digits.slice(6, 9));
        }

        let formatted = parts.join(".");
        if (digits.length > 9) {
          formatted += `-${digits.slice(9, 11)}`;
        }

        return formatted;
      };

      cpfInput.addEventListener("input", (event) => {
        event.target.value = formatCpf(event.target.value);
      });
    </script>
  </body>
</html>

<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastro de Empresa</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Inter", "Segoe UI", system-ui, sans-serif;
        line-height: 1.5;
        --bg: #f4f6fb;
        --card: #ffffff;
        --text: #1b1f3b;
        --muted: #5f6b7a;
        --primary: #2257d8;
        --border: #d9deea;
        --focus: #ffb703;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
      }

      .container {
        max-width: 960px;
        margin: 40px auto;
        padding: 0 24px 48px;
      }

      header {
        margin-bottom: 24px;
      }

      h1 {
        margin-bottom: 8px;
        font-size: 2rem;
      }

      p {
        margin: 0;
        color: var(--muted);
      }

      form {
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      .card {
        background: var(--card);
        padding: 20px;
        border-radius: 12px;
        border: 1px solid var(--border);
        box-shadow: 0 8px 24px rgba(27, 31, 59, 0.08);
      }

      .card h2 {
        margin-top: 0;
        margin-bottom: 16px;
        font-size: 1.2rem;
      }

      .grid {
        display: grid;
        gap: 16px;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      }

      label {
        display: flex;
        flex-direction: column;
        gap: 6px;
        font-weight: 600;
        color: var(--text);
      }

      label input,
      label select,
      label textarea {
        padding: 10px 12px;
        border-radius: 8px;
        border: 1px solid var(--border);
        font-size: 0.95rem;
        background: #fff;
      }

      label input:focus,
      label select:focus,
      label textarea:focus {
        outline: 2px solid var(--focus);
        border-color: transparent;
      }

      label.full {
        margin-top: 16px;
      }

      .hint {
        font-weight: 400;
        font-size: 0.85rem;
        color: var(--muted);
      }

      .checkbox {
        flex-direction: row;
        align-items: center;
        gap: 8px;
        font-weight: 500;
        color: var(--muted);
      }

      .checkbox input {
        margin: 0;
      }

      .actions {
        display: flex;
        align-items: center;
        gap: 16px;
      }

      button {
        background: var(--primary);
        color: #fff;
        border: none;
        border-radius: 999px;
        padding: 12px 26px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
      }

      button:hover {
        background: #1b47b3;
      }

      #form-message {
        margin: 0;
        font-weight: 600;
      }

      #form-message.error {
        color: #c1121f;
      }

      #form-message.success {
        color: #0f8b4c;
      }

      @media (max-width: 640px) {
        .actions {
          flex-direction: column;
          align-items: flex-start;
        }
      }
    </style>
  </head>
  <body>
    <main class="container">
      <header>
        <h1>Cadastro de Empresa</h1>
        <p>Preencha os dados abaixo para cadastrar sua empresa no sistema.</p>
      </header>

      <form id="company-form" novalidate>
        <section class="card">
          <h2>Dados da empresa</h2>
          <div class="grid">
            <label>
              Razão social
              <input type="text" name="razaoSocial" required />
            </label>
            <label>
              Nome fantasia
              <input type="text" name="nomeFantasia" required />
            </label>
            <label>
              CNPJ
              <input
                type="text"
                name="cnpj"
                inputmode="numeric"
                placeholder="00.000.000/0000-00"
                required
              />
            </label>
            <label>
              Segmento da empresa
              <select name="segmento" required>
                <option value="">Selecione</option>
                <option>Hotel</option>
                <option>Pousada</option>
                <option>Restaurante</option>
                <option>Agência de turismo</option>
                <option>Empresa de eventos</option>
                <option>Outro</option>
              </select>
            </label>
          </div>
          <label class="full">
            Descrição da empresa (opcional, até 500 caracteres)
            <textarea name="descricao" maxlength="500" rows="4"></textarea>
          </label>
        </section>

        <section class="card">
          <h2>Endereço</h2>
          <div class="grid">
            <label>
              CEP
              <input
                type="text"
                name="cep"
                inputmode="numeric"
                placeholder="00000-000"
                required
              />
              <span class="hint">Preenchimento automático ao informar o CEP.</span>
            </label>
            <label>
              Logradouro
              <input type="text" name="logradouro" required />
            </label>
            <label>
              Número
              <input type="text" name="numero" required />
            </label>
            <label>
              Complemento
              <input type="text" name="complemento" />
            </label>
            <label>
              Bairro
              <input type="text" name="bairro" required />
            </label>
            <label>
              Cidade
              <input type="text" name="cidade" value="Foz do Iguaçu" required />
            </label>
            <label>
              Estado (UF)
              <input type="text" name="uf" maxlength="2" required />
            </label>
          </div>
        </section>

        <section class="card">
          <h2>Contato da empresa</h2>
          <div class="grid">
            <label>
              Nome do responsável legal
              <input type="text" name="responsavel" required />
            </label>
            <label>
              Telefone (com DDD)
              <input type="tel" name="telefone" placeholder="(45) 00000-0000" required />
            </label>
            <label>
              WhatsApp
              <input type="tel" name="whatsapp" placeholder="(45) 00000-0000" />
              <span class="checkbox">
                <input type="checkbox" id="usar-telefone" />
                <label for="usar-telefone">usar o mesmo número</label>
              </span>
            </label>
            <label>
              E-mail corporativo
              <input type="email" name="emailCorporativo" required />
            </label>
          </div>
        </section>

        <section class="card">
          <h2>Acesso ao sistema</h2>
          <div class="grid">
            <label>
              E-mail de acesso
              <input type="email" name="emailAcesso" required />
              <span class="checkbox">
                <input type="checkbox" id="usar-email" />
                <label for="usar-email">usar o e-mail corporativo</label>
              </span>
            </label>
            <label>
              Senha
              <input type="password" name="senha" minlength="8" required />
            </label>
            <label>
              Confirmar senha
              <input type="password" name="confirmarSenha" minlength="8" required />
            </label>
          </div>
        </section>

        <section class="card">
          <h2>Informações adicionais (opcional)</h2>
          <div class="grid">
            <label>
              Site da empresa
              <input type="url" name="site" placeholder="https://" />
            </label>
            <label>
              Instagram
              <input type="text" name="instagram" placeholder="@usuario" />
            </label>
            <label>
              Facebook
              <input type="text" name="facebook" placeholder="facebook.com/suaempresa" />
            </label>
            <label>
              Logo da empresa
              <input type="file" name="logo" accept="image/*" />
            </label>
          </div>
        </section>

        <section class="card">
          <h2>Termos e confirmação</h2>
          <label class="checkbox">
            <input type="checkbox" name="termos" required />
            Aceito os termos de uso e a política de privacidade.
          </label>
        </section>

        <div class="actions">
          <button type="submit">Cadastrar empresa</button>
          <p id="form-message" role="status" aria-live="polite"></p>
        </div>
      </form>
    </main>

    <script>
      const form = document.querySelector("#company-form");
      const message = document.querySelector("#form-message");
      const cepInput = form.querySelector("[name=cep]");
      const cidadeInput = form.querySelector("[name=cidade]");
      const ufInput = form.querySelector("[name=uf]");
      const logradouroInput = form.querySelector("[name=logradouro]");
      const bairroInput = form.querySelector("[name=bairro]");
      const usarTelefone = document.querySelector("#usar-telefone");
      const usarEmail = document.querySelector("#usar-email");
      const telefoneInput = form.querySelector("[name=telefone]");
      const whatsappInput = form.querySelector("[name=whatsapp]");
      const emailCorporativoInput = form.querySelector("[name=emailCorporativo]");
      const emailAcessoInput = form.querySelector("[name=emailAcesso]");

      const setMessage = (text, type = "") => {
        message.textContent = text;
        message.className = type;
      };

      const normalizeCep = (value) => value.replace(/\D/g, "").slice(0, 8);

      const preencherEndereco = async (cep) => {
        if (cep.length !== 8) {
          return;
        }

        try {
          const response = await fetch(`https://viacep.com.br/ws/${cep}/json/`);
          if (!response.ok) {
            throw new Error("CEP não encontrado.");
          }
          const data = await response.json();
          if (data.erro) {
            throw new Error("CEP inválido.");
          }

          logradouroInput.value = data.logradouro || "";
          bairroInput.value = data.bairro || "";
          cidadeInput.value = data.localidade || "";
          ufInput.value = data.uf || "";
        } catch (error) {
          setMessage("Não foi possível localizar o CEP informado.", "error");
        }
      };

      cepInput.addEventListener("blur", () => {
        const cep = normalizeCep(cepInput.value);
        cepInput.value = cep.replace(/(\d{5})(\d{3})/, "$1-$2");
        preencherEndereco(cep);
      });

      usarTelefone.addEventListener("change", () => {
        whatsappInput.value = usarTelefone.checked ? telefoneInput.value : "";
      });

      telefoneInput.addEventListener("input", () => {
        if (usarTelefone.checked) {
          whatsappInput.value = telefoneInput.value;
        }
      });

      usarEmail.addEventListener("change", () => {
        emailAcessoInput.value = usarEmail.checked ? emailCorporativoInput.value : "";
      });

      emailCorporativoInput.addEventListener("input", () => {
        if (usarEmail.checked) {
          emailAcessoInput.value = emailCorporativoInput.value;
        }
      });

      form.addEventListener("submit", (event) => {
        event.preventDefault();
        setMessage("");

        const senha = form.querySelector("[name=senha]").value;
        const confirmarSenha = form.querySelector("[name=confirmarSenha]").value;
        const cidade = cidadeInput.value.trim().toLowerCase();

        if (senha.length < 8) {
          setMessage("A senha deve conter pelo menos 8 caracteres.", "error");
          return;
        }

        if (senha !== confirmarSenha) {
          setMessage("As senhas não conferem.", "error");
          return;
        }

        if (cidade !== "foz do iguaçu" && cidade !== "foz do iguacu") {
          setMessage("A sede da empresa deve ser em Foz do Iguaçu.", "error");
          return;
        }

        if (!form.checkValidity()) {
          setMessage("Preencha todos os campos obrigatórios corretamente.", "error");
          return;
        }

        setMessage("Cadastro validado! Pronto para enviar ao backend.", "success");
      });
    </script>
  </body>
</html>
